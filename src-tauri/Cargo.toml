[package]
name = "wormforge-code-editor"
version = "1.0.0"
description = "WormForge Lua Code Editor with Real-Time Collaboration and Engine Verbs"
authors = ["LucianoWorms"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
