[package]
name = "wormforge-code-editor"
version = "1.0.0"
description = "WormForge Lua Code Editor with Engine Verbs and AST Inspector"
authors = ["LucianoWorms"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The exact Lua build the game compiles mods against (WormForge-main-source
# workspace Cargo.toml:15). lua54 = version parity with the engine, vendored =
# no Lua installation needed on this machine. Only the front end is used, via
# Chunk::into_function() in src/main.rs, which compiles without executing.
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
