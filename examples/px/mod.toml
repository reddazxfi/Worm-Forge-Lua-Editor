[[components]]

id = "hl.rules"
type = "feature"
name = "Highlander rules"
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried. Each placed weapon's pool is one of its settings."
entry = "components/highlander.lua"
before_weapons = true

[[components.weapon_options]]
key = "pool"
type = "choice"
choices = ["offensive", "second", "movement", "not dealt"]
default = "not dealt"
label = "Highlander pool"
description = "Each worm is dealt one weapon from each pool."

[[components.weapon_options]]
key = "cavern"
type = "bool"
default = true
label = "Dealt on cavern maps"
description = "Off for weapons that come from the sky."
[[components]]

id = "ktk.control"
type = "feature"
name = "Kill the King"
description = "Project X's Kill the King (CKtkControl): the attackers must destroy the defenders' king before the timer runs out."
entry = "components/kill_the_king.lua"
[[components]]

id = "px.oil_drums"
type = "feature"
name = "Project X oil drums"
description = "Every oil drum on the map is one of Project X's: explosive, napalm, nuke, cluster, icy, electric, mine, or on cavern maps teleport, each drawn as its kind and bursting into it. The nuke drum needs the Nuke Rocket placed."
entry = "components/oil_drums.lua"
before_weapons = true
[[components]]

id = "px.double_bazooka"
type = "weapon"
name = "Double Bazooka"
authors = ["PyroMan"]
description = "Highlander's Double Bazooka."
entry = "components/weapon.lua"
icon = "sprites/double_bazooka/double_bazooka_ico.png"
default_position = { row = "F1", column = 1 }

[components.suggests."hl.rules"]
pool = "offensive"
