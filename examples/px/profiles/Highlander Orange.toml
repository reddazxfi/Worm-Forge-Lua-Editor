# WormForge profile "Highlander Orange": made in the mod loader; safe to edit by hand.
description = "Project X's Highlander: each worm is dealt one weapon from each of three pools, may use each once a turn, and takes everything a worm it kills carried."
features = ["core.utilities", "hl.rules", "px.oil_drums"]

[options."px.3_girder_pack"]
placement_range = 300

[options."core.utilities"]
agility = true
collect_viewer = true
instant_death = true
live_hp = true
parkour = true

[scheme]
automatic_end_of_turn_retreat = true
weapon_use_doesn_t_end_turn = true

[weapon_options."hl.rules"."stock.baseball_bat"]
pool = "second"

[weapon_options."hl.rules"."stock.dynamite"]
pool = "offensive"

[weapon_options."hl.rules"."stock.flame_thrower"]
