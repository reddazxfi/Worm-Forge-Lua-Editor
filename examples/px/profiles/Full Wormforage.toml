# WormBench profile "Full Wormforage": made in the mod loader; safe to edit by hand.
description = "The Full Fromage"
features = ["core.utilities", "px.oil_drums", "px.saw_random", "spawn.bees.swarm"]

[options."core.utilities"]
agility = true
collect_viewer = true
damage_numbers = true
ex_turn_side = true
fast_aim = true
fps_counter = true
instant_death = "in_flight"
live_hp = true
parkour = true

[options."px.saw_random"]
quantity = 2

[options."spawn.bees.swarm"]
bee_amount = 2

[scheme]
hazards = 143
loss_of_control_doesn_t_end_turn = true
turn_time = "unlimited"
weapon_use_doesn_t_end_turn = true
worm_energy = 250

